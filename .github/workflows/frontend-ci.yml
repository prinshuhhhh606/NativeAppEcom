name: AppEcom Web Frontends CI

on:
  push:
    branches: ["**"]
    paths:
      - "seller-frontend/**"
      - "admin-frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches: ["**"]
    paths:
      - "seller-frontend/**"
      - "admin-frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend-build:
    name: ${{ matrix.name }} Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Seller
            directory: seller-frontend
            lockfile: seller-frontend/package-lock.json

          - name: Admin
            directory: admin-frontend
            lockfile: admin-frontend/package-lock.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install Dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Build Production Frontend
        working-directory: ${{ matrix.directory }}
        run: npm run build
